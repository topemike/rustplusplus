# nginx site for the rustplusplus web panel.
# Copy to /etc/nginx/sites-available/, replace rust.tudominio.com with your domain,
# then run certbot to add HTTPS (see docs/web_panel.md).
server {
    listen 80;
    listen [::]:80;
    server_name rust.tudominio.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
